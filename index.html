<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plants on Fire Hub</title>
<style>
:root{
  --sidebar-bg:#12321e;--sidebar-bg-2:#0d2517;--sidebar-ink:#f7f2d9;--sidebar-muted:rgba(247,242,217,.65);
  --content-bg:#f4ecd2;--content-alt:#fff;--ink:#2b3626;--muted:#5f6a55;
  --yellow:#ffd12e;--orange:#ff7a2b;--red:#e63a1c;--green:#58a634;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:var(--content-bg)}
button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:240px 1fr;overflow:hidden}
.sidebar{height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-2));color:#fff;border-right:3px solid #0a1b10}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px dashed rgba(255,255,255,.18)}
.logo-mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffb01f,#ff4b2b);border:3px solid #1b0e04}
.logo strong{display:block;color:var(--yellow);font-size:19px}.logo span{font-size:11px;letter-spacing:.2em;color:#ffdb7a}
.nav{display:flex;flex-direction:column;gap:6px}.nav button{position:relative;min-height:58px;padding:10px 14px;border:0;background:transparent;color:var(--sidebar-muted);text-align:left;cursor:pointer;font-weight:800}
.nav button small{display:block;font-size:10px;letter-spacing:.18em;color:#ffdb7a;opacity:.6;margin-bottom:4px}
.nav button.active,.nav button:hover{color:var(--yellow);background:linear-gradient(90deg,rgba(255,209,46,.14),transparent);outline:2px solid rgba(255,209,46,.45)}
.main{min-width:0;height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.topbar{padding:18px 30px;background:linear-gradient(90deg,#1e4025,#0f2716);color:#fff;border-bottom:4px solid #0a1b10}
.topbar h1{margin:0;color:var(--yellow);font-size:23px}.topbar p{margin:5px 0 0;color:rgba(255,255,255,.72);font-size:12px}
.content{padding:24px 30px 32px;overflow:auto;background:var(--content-bg)}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 15px;background:#fff;border:2px solid #0a1b10;border-radius:14px;box-shadow:0 4px 0 #0a1b10;margin-bottom:20px}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:230px;height:40px;padding:0 14px;background:#fff9e0;border:2px solid #0a1b10;border-radius:20px}
.search input{flex:1;border:0;outline:0;background:transparent}.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border:2px solid #0a1b10;border-radius:18px;background:#fff9e0;font-weight:800;cursor:pointer}
.chip.active{background:var(--green);color:#fff;box-shadow:0 3px 0 #0a1b10}.count{font-size:12px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{position:relative;overflow:hidden;padding:0;background:#fff;border:3px solid #0a1b10;border-radius:16px;box-shadow:0 5px 0 #0a1b10;cursor:pointer;transition:.16s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 #0a1b10}.portrait{height:150px;background:#e8dfc5;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #0a1b10}
.portrait img{width:100%;height:100%;object-fit:contain}.id,.rarity{position:absolute;top:8px;padding:3px 8px;border-radius:9px;font-size:10px;font-weight:900;z-index:2}
.id{left:9px;background:var(--yellow);border:2px solid #0a1b10}.rarity{right:9px;background:rgba(10,27,16,.85);color:#fff}
.card-body{padding:11px 12px;background:linear-gradient(#fff8d9,#fff4c4);text-align:left;min-height:92px}.card-body strong{display:block;font-size:15px}.card-body small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.meta span{padding:3px 7px;border:1px solid rgba(10,27,16,.25);border-radius:999px;font-size:10px;font-weight:700}
.back{margin-bottom:18px;padding:8px 14px;border:2px solid #0a1b10;border-radius:18px;background:#fff9e0;font-weight:800;box-shadow:0 3px 0 #0a1b10;cursor:pointer}
.detail{display:grid;grid-template-columns:320px 1fr 1fr;grid-template-areas:"hero stats gameart" "hero skill gameart" "hero obtain gameart" "levels levels levels" "variants variants variants";gap:16px;align-items:start}
.box,.hero{background:#fff;border:3px solid #0a1b10;border-radius:16px;box-shadow:0 5px 0 #0a1b10;overflow:hidden}.box{padding:17px}
.hero{grid-area:hero;min-height:470px;position:relative;background:linear-gradient(160deg,#ffd37b,#d15c3c 60%,#582017);display:flex;flex-direction:column;justify-content:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:20px 10px 110px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.hero::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(10,27,16,.9))}.hero-copy{position:relative;z-index:2;padding:18px;color:#fff}.hero-copy small{color:#ffe480}.hero-copy h2{font-size:29px;margin:4px 0}.hero-copy p{margin:4px 0;color:rgba(255,255,255,.8);font-size:12px}
.stats{grid-area:stats}.skill{grid-area:skill}.obtain{grid-area:obtain}.gameart{grid-area:gameart}.levels{grid-area:levels}.variants{grid-area:variants}
.box h3{margin:0 0 12px;font-size:18px}.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(10,27,16,.15)}.kv:last-child{border-bottom:0}.kv b{font-size:12px}.kv span{font-size:13px;color:var(--muted)}
.source-note{font-size:11px;color:var(--muted);line-height:1.6}
.timeline{display:flex;flex-direction:column;gap:10px}.level{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:start}.lvl{font-weight:900;color:#aa4b25;padding-top:10px}.effect{padding:10px 12px;background:#fff8df;border:2px solid rgba(10,27,16,.16);border-radius:12px;line-height:1.6}
.variant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.variant-card{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:12px;background:#fff8df;border:2px solid rgba(10,27,16,.16);border-radius:12px}.variant-card img{width:82px;height:82px;object-fit:contain;background:#eadfc0;border-radius:10px}.variant-card h4{margin:0 0 4px}.variant-card small{color:var(--muted)}.variant-card p{margin:8px 0 0;font-size:12px;line-height:1.55}
.hero-news{padding:24px;background:linear-gradient(135deg,#1f512f,#112c1b);color:#fff;border:3px solid #0a1b10;border-radius:18px;box-shadow:0 5px 0 #0a1b10;margin-bottom:18px}.hero-news h2{margin:6px 0;color:var(--yellow)}
.social-platform-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.social-link-card{display:flex;align-items:center;gap:14px;padding:18px;background:#fff;border:3px solid #0a1b10;border-radius:16px;box-shadow:0 5px 0 #0a1b10;text-decoration:none;color:inherit}.social-link-icon{font-size:28px}.social-link-copy h3{margin:0 0 4px}.social-link-copy p{margin:0;color:var(--muted);font-size:12px}
.placeholder{padding:32px;background:#fff;border:3px solid #0a1b10;border-radius:16px;box-shadow:0 5px 0 #0a1b10;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto;overflow:auto}.sidebar{height:auto}.main{height:auto;overflow:visible}.content{overflow:visible}.detail{grid-template-columns:1fr;grid-template-areas:"hero" "stats" "skill" "obtain" "gameart" "levels" "variants"}}

/* ===== Detail layout refinement: compact skill / obtain blocks ===== */
.skill{
  align-self:start;
}
.obtain{
  align-self:start;
}
.skill-text{
  display:inline-block;
  width:auto;
  max-width:100%;
  padding:9px 12px;
  line-height:1.65;
  font-size:14px;
  background:#fff8df;
  border:2px solid rgba(10,27,16,.16);
  border-radius:10px;
}
.skill .skill-text{
  min-height:0;
}
.skill.box{
  padding-bottom:14px;
}
.obtain.box{
  min-height:0;
}
.obtain.box:has(> h3:only-child){
  padding-bottom:12px;
}

  .skill-text{display:block;width:100%}
}


.gameart{
  min-height:470px;
  display:flex;
  flex-direction:column;
}
.gameart-placeholder{
  flex:1;
  min-height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  border:2px dashed rgba(10,27,16,.22);
  border-radius:12px;
  background:linear-gradient(180deg,#fffaf0,#f3ecd5);
  color:var(--muted);
}

  display:block;
  margin-bottom:6px;
  color:var(--ink);
  font-size:15px;
}


.rarity-label{display:inline-block;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:800}
.rarity-label[data-rarity="稀有"],.chip[data-r="稀有"]{background:#2563eb;color:#fff}
.rarity-label[data-rarity="史诗"],.chip[data-r="史诗"]{background:#9333ea;color:#fff}
.rarity-label[data-rarity="传说"],.chip[data-r="传说"]{background:#ea580c;color:#fff}
.chip[data-r].active{outline:3px solid var(--yellow);outline-offset:2px}
.social-link-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center}.social-link-icon img{display:block;object-fit:contain}

.logo{padding:0 0 16px;justify-content:center}.game-logo{display:block;width:100%;max-width:228px;height:auto;border-radius:0}

.card-open{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.companion-tags{display:flex;gap:6px;flex-wrap:wrap}.card>.companion-tags{padding:0 12px 12px;background:#fff4c4}.stats>.companion-tags{margin-bottom:10px}
.tag{padding:5px 10px;border:1px solid #8b9d76;border-radius:999px;background:#edf3e4;color:#284b28;font-size:12px;font-weight:700;cursor:pointer}
.tag:hover,.tag.active{background:#285c35;color:#fff;border-color:#285c35}.tag:focus-visible,.card-open:focus-visible{outline:3px solid #e5a600;outline-offset:-3px}
.tag-filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 20px}.tag-filters b{font-size:13px;margin-right:4px}

/* Consistent colors for companion tags and their filters. */
.tag[data-tag-link="群攻"],.tag[data-tag-filter="群攻"]{--tag-bg:#fff0e5;--tag-ink:#9a3412;--tag-border:#efad83}
.tag[data-tag-link="单体"],.tag[data-tag-filter="单体"]{--tag-bg:#eaf2ff;--tag-ink:#1e40af;--tag-border:#9ebcf2}
.tag[data-tag-link="辅助"],.tag[data-tag-filter="辅助"]{--tag-bg:#e6f6ec;--tag-ink:#166534;--tag-border:#8fcba4}
.tag[data-tag-link="控制"],.tag[data-tag-filter="控制"]{--tag-bg:#e4f6fa;--tag-ink:#155e75;--tag-border:#82c8d8}
.tag[data-tag-link="召唤"],.tag[data-tag-filter="召唤"]{--tag-bg:#f2eaff;--tag-ink:#6b21a8;--tag-border:#c6a2eb}
.tag[data-tag-link="成长"],.tag[data-tag-filter="成长"]{--tag-bg:#f0f5dc;--tag-ink:#466014;--tag-border:#b4c776}

.tag[data-tag-link="变身"],.tag[data-tag-filter="变身"]{--tag-bg:#eeedff;--tag-ink:#4b3a9c;--tag-border:#b4a9e8}
.tag{background:var(--tag-bg,#edf3e4);color:var(--tag-ink,#284b28);border-color:var(--tag-border,#8b9d76);transition:box-shadow .15s,filter .15s}
.tag:hover{background:var(--tag-bg,#edf3e4);color:var(--tag-ink,#284b28);border-color:var(--tag-ink,#284b28);filter:brightness(.96)}
.tag.active{background:var(--tag-ink,#285c35);color:#fff;border-color:var(--tag-ink,#285c35);box-shadow:0 0 0 2px var(--content-bg),0 0 0 4px var(--tag-ink,#285c35)}

.skill-keyword{color:#215c36;font-weight:800;text-decoration:underline dotted;text-underline-offset:4px;cursor:help;border-radius:3px}
.skill-keyword:hover,.skill-keyword:focus-visible{background:#e6f6ec;outline:2px solid #8fcba4;outline-offset:2px}

/* Shared title background for every page. */
.topbar{background-image:linear-gradient(90deg,rgba(8,24,14,.82),rgba(8,24,14,.32)),url("assets/5b841bde2c0bdf1fe1ee64ffe64eb771b7cede85e25e15f365285bf64dc5b0ec.jpg");background-size:cover;background-position:center 45%;background-repeat:no-repeat}.topbar h1,.topbar p{text-shadow:0 2px 4px rgba(0,0,0,.7)}.topbar p{color:#fff}

.topbar p:empty{display:none}

.home-welcome{margin-bottom:24px}.home-welcome .eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;color:#53733d}.home-welcome h2{font-size:clamp(26px,3vw,40px);margin:8px 0 10px}.home-welcome p{margin:0;color:var(--muted);line-height:1.7}
.home-columns{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:20px;align-items:stretch}.home-panel{background:#fffaf0;border:3px solid #0a1b10;border-radius:18px;box-shadow:0 5px 0 #0a1b10;padding:22px}.home-panel h3{margin:0 0 8px;font-size:21px}.home-panel p{color:var(--muted);line-height:1.65;margin:0 0 18px}.pool-image-slot{min-height:255px;aspect-ratio:16/9;border:2px dashed #a9b58c;border-radius:12px;background:linear-gradient(135deg,#e7edce,#f8e7be);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;color:#5f704a}.pool-image-slot span:first-child{font-size:40px}.pool-image-slot small{font-size:12px}.daily-art{height:190px;display:grid;place-items:center;background:radial-gradient(ellipse,#ffe695,transparent 70%);margin:0 0 8px}.daily-art img{width:100%;height:190px;object-fit:contain;filter:drop-shadow(0 8px 8px #0002)}.daily-name{font-size:22px;font-weight:900;text-align:center;margin-bottom:8px}.daily-tags{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}.home-action{display:inline-flex;justify-content:center;align-items:center;padding:11px 18px;border:2px solid #0a1b10;border-radius:999px;background:var(--yellow);color:#20341f;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 #0a1b10}.home-action:hover{filter:brightness(1.05);transform:translateY(-1px)}.home-action:focus-visible{outline:3px solid #2875dd;outline-offset:4px}.daily-action{width:100%}.home-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.home-shortcuts .home-panel{display:flex;flex-direction:column;align-items:flex-start}.home-shortcuts .home-action{margin-top:auto;background:#e5efda}.home-panel-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.home-panel-heading h3{margin:0}.home-badge{font-size:11px;border-radius:999px;padding:5px 9px;background:#e5edda;color:#486335;white-space:nowrap}

.star-switch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.star-button{padding:7px 15px;border:2px solid #667c45;border-radius:999px;background:#fffaf0;color:#334a26;font-weight:800;cursor:pointer}.star-button:hover{background:#f9e9a6}.star-button.active{background:var(--yellow);border-color:#263f22;box-shadow:0 2px 0 #263f22}.star-button:focus-visible{outline:3px solid #2875dd;outline-offset:3px}.star-note{font-size:11px;color:var(--muted);margin:10px 0 0}.skill-text{white-space:pre-line}

const keywordDescriptions={
  '光环':'只要满足光环的条件就可以获得对应的效果。',
  '就绪':'双方玩家都点击就绪后，触发这个效果。',
  '临时':'只在本回合生效，回合结束时会失效。',
  '部署':'购买随从并将其放入空位触发这个效果。',
  '法术':'经过充能后才能生效，同时无法攻击。',
  '休眠':'本回合无法再行动和触发效果'
};
function markKeywords(text){
  const safe=String(text||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  return safe.replace(/光环|就绪|临时|部署|法术|休眠/g,word=>`<span class="skill-keyword" tabindex="0" title="${keywordDescriptions[word]}" aria-label="${word}：${keywordDescriptions[word]}">${word}</span>`);
}

function starMilestoneData(form){
 const available=[...new Set(form.rows.filter(r=>r.effect!==null&&r.level<=10).map(r=>r.level))].sort((a,b)=>b-a);
 const level=available.find(l=>[1,2,3,4].every(star=>form.rows.some(r=>r.level===l&&r.star===star&&r.effect!==null)))??available[0];
 const rows=[1,2,3,4].map(star=>form.rows.find(r=>r.level===level&&r.star===star&&r.effect!==null));
 const items=[2,3,4].map(star=>{
  const before=rows[star-2]?.effect,after=rows[star-1]?.effect;
  if(before==null||after==null)return {star,lead:'',text:'暂无该星级的完整技能数据。'};
  // Star-gated readiness is unlocked even when all star rows share the same description.
  const gates=[...after.matchAll(/(?:自身|，)([234])星[，,]([^，。\n]+)/g)];
  const gate=gates.find(m=>Number(m[1])===star);
  if(gate)return {star,lead:'将满足触发条件：',text:(after.startsWith('就绪')?'就绪时，':'')+gate[2]+'。'};
  if(before===after)return {star,lead:'',text:'技能效果保持不变。'};
  const a=before.match(/^同时攻击(\d+)个敌人/),b=after.match(/^同时攻击(\d+)个敌人/);
  if(a&&b&&before.replace(a[0],'')===after.replace(b[0],''))return {star,lead:'',text:'同时攻击的敌人数由'+a[1]+'个增加至'+b[1]+'个。'};
  const oldLines=before.split('\n'),newLines=after.split('\n');
  const changed=newLines.filter((line,i)=>line!==oldLines[i]);
  const added=changed.length&&changed.every(line=>!oldLines.includes(line))&&oldLines.every(line=>newLines.includes(line));
  return {star,lead:added?'将解锁效果：':'技能效果调整为：',text:(changed.length?changed:newLines).join('\n')};
 });
 return {level,items};
}
function starUpgradeIntro(form){
 const levels=new Map();
 for(const row of form.rows){if(row.effect==null)continue;if(!levels.has(row.level))levels.set(row.level,new Set());levels.get(row.level).add(row.effect.trim());}
 const changes=[...levels.values()].some(effects=>effects.size>1);
 const summary=(form.starSummary||'').trim();
 return changes&&!/描述相同|效果相同|保持不变|暂无|没有变化/.test(summary)?summary:'';
}
function renderStarMilestones(form,selectedStar){
 const summary=starUpgradeIntro(form);
 return '<p class="star-upgrade-hint">升星可提升随从能力，点击下方星级查看具体效果。</p>'+(summary?'<p class="star-upgrade-intro">'+markKeywords(summary)+'</p>':'');
}

function highlightedStarEffect(row){
 if(!row||row.effect===null)return '暂无该星级数据';
 let out='',last=0;for(const [start,end] of row.starHighlights||[]){out+=markKeywords(row.effect.slice(last,start))+'<mark class="star-value">'+row.effect.slice(start,end)+'</mark>';last=end;}
 return out+markKeywords(row.effect.slice(last));
}

function levelDifference(before,after){
 // Align unchanged characters, treating each number as one token.
 const tokens=t=>String(t||'').match(/\d+(?:\.\d+)?%?|[\s\S]/g)||[];
 const a=tokens(before),b=tokens(after),dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);
 const changed=Array(b.length).fill(true);let i=0,j=0;
 while(i<a.length&&j<b.length){if(a[i]===b[j]){changed[j]=false;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
 let output='',start=0;
 while(start<b.length){let end=start+1;while(end<b.length&&changed[end]===changed[start])end++;const raw=b.slice(start,end).join('');
 if(changed[start]){
  const leading=raw.match(/^[\s，,。；;：:、！？!?（）()【】\[\]“”‘’]+/)?.[0]||'';
  const rest=raw.slice(leading.length);
  const trailing=rest.match(/[\s，,。；;：:、！？!?（）()【】\[\]“”‘’]+$/)?.[0]||'';
  const core=rest.slice(0,rest.length-trailing.length);
  output+=markKeywords(leading)+(core?'<mark class="level-change">'+markKeywords(core)+'</mark>':'')+markKeywords(trailing);
 }else output+=markKeywords(raw);
 start=end;}
 return output;
}

const deckState={slots:Array(9).fill(null),active:0,query:'',pending:null,pickerOpen:false};

 const out=[];
 deckState.slots.filter(Boolean).forEach(d=>{const c=companions.find(c=>c.id===d.id),f=c.cardForms[d.form],text=f.rows.map(r=>r.effect||'').join('\n');
 const types=[];if(c.id==='103200'&&/召唤.*自身的复制体/.test(text))types.push(['joker-copy','草莓小丑复制体']);if(text.includes('临时菜犬'))types.push(['dog','菜犬']);if(text.includes('山竹小猪'))types.push(['pig','山竹小猪']);if(text.includes('起爆萝卜'))types.push(['bomb','起爆萝卜']);if(text.includes('临时复制体'))types.push(['copy1','鲜橙复制体 1'],['copy2','鲜橙复制体 2']);
 if(/随机召唤1个3费或5费/.test(text))types.push(['random','随机召唤随从']);
 types.forEach(([type,name])=>out.push({id:'summon-'+d.id+'-'+d.form+'-'+type,name,image:summonImages[type]||c.image,sourceId:d.id,sourceForm:d.form,sourceName:c.name+' · '+f.label,type,cardForms:[{label:'召唤物',image:summonImages[type]||c.image,rows:[],attackByLevel:{}}]}));
 });return out;

function formationUnit(id){return companions.find(c=>c.id===id)||availableSummons().find(c=>c.id===id);}
function summonStats(x){
 const c=formationUnit(x.id),source=companions.find(m=>m.id===c.sourceId),form=source.cardForms[c.sourceForm];
 if(Number.isFinite(x.summonAttack))return {attack:Math.round(x.summonAttack),effect:'来源：'+c.sourceName+'。当前使用手动攻击力；清空输入可恢复自动计算。'};
 const candidates=formationState.slots.map((s,i)=>({s,i})).filter(o=>o.s?.id===c.sourceId&&o.s.form===c.sourceForm);
 if(candidates.length>1)return {attack:'—',effect:'场上有多个对应召唤者，请手动填写本次召唤攻击力。'};
 const owner=candidates[0],sourceSlot=owner?.s||{id:c.sourceId,form:c.sourceForm,star:1,level:x.level};
 const text=formationStats(sourceSlot).effect;
 let value=null,m,reason='';
 if(c.type==='dog'&&(m=text.match(/召唤\d+只攻击力为(\d+(?:\.\d+)?)的1星临时菜犬/))){value=Number(m[1])*Math.pow(2,x.star-1);reason='技能中1星菜犬攻击力 '+m[1]+'，按当前召唤物星级翻倍';}
 else if(['pig','copy1','copy2','bomb','random','joker-copy'].includes(c.type)){
 let ratio=c.type==='joker-copy'?100:null;
 if(c.type==='pig'&&(m=text.match(/继承(\d+(?:\.\d+)?)%攻击力/)))ratio=+m[1];
 if(c.type.startsWith('copy')&&(m=text.match(/继承自身(\d+(?:\.\d+)?)%攻击力和(\d+(?:\.\d+)?)%攻击力/)))ratio=+m[c.type==='copy1'?1:2];
 if(c.type==='bomb'&&(m=text.match(/攻击力为自身(\d+(?:\.\d+)?)%/)))ratio=+m[1];
 if(c.type==='random'&&(m=text.match(/继承[^\n]*?(\d+(?:\.\d+)?)%的攻击力/)))ratio=+m[1];
 if(!owner)return {attack:'—',effect:'请先将'+source.name+'的对应卡牌放入最终阵容，才能计算继承攻击力；也可手动填写。'};
 const base=formationStats(sourceSlot).attack;
 if(ratio!==null&&typeof base==='number'){const e=evaluateFormation(),total=base+e.aura[owner.i]+formationPreview.bonuses[owner.i];value=total*ratio/100;reason='召唤者当前攻击力 '+Number(total.toFixed(2))+' × '+ratio+'%（按召唤技能直接继承，不额外按星级翻倍）';}
 }
 return {attack:value===null?'—':Math.round(value),effect:'来源：'+c.sourceName+'。'+(value===null?'此效果依赖召唤次数等额外条件，请手动填写实际攻击力。':reason+'。'+(!owner?'未放置召唤者，暂按所选等级、1星召唤者技能预览。':'随场上召唤者当前状态更新。'))};

const previewEscape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function syncFormationPreview(){const key=JSON.stringify(formationState.slots);if(key!==formationPreview.key){formationPreview.key=key;resetFormationPreview();}}
function resetFormationPreview(){formationPreview.ready=false;formationPreview.bonuses=Array(9).fill(0);formationPreview.logs=[];}
function evaluateFormation(){
 const slots=formationState.slots, occupied=slots.map((x,i)=>x?i:-1).filter(i=>i>=0), aura=Array(9).fill(0),notes=Array.from({length:9},()=>[]),unsupported=[],readyRules=[];
 const name=i=>formationUnit(slots[i].id).name+'（第'+(i+1)+'格）';
 const addAura=(i,targets,n)=>targets.forEach(j=>{aura[j]+=n;notes[j].push(name(i)+' 光环 +'+Number(n.toFixed(2)));});
 occupied.forEach(i=>{
 if(slots[i].id.startsWith('summon-'))return;
 const effect=formationStats(slots[i]).effect;
 for(const line of effect.split('\n')){
 let m;
 if(line.startsWith('光环：')){
 if(m=line.match(/^光环：使十字范围内的随从攻击力\+(\d+(?:\.\d+)?)$/))addAura(i,occupied.filter(j=>Math.abs(Math.floor(i/3)-Math.floor(j/3))+Math.abs(i%3-j%3)===1),+m[1]);
 else if(m=line.match(/^光环：使处于自身上方1格的随从攻击力\+(\d+(?:\.\d+)?)$/))addAura(i,occupied.filter(j=>j===i-3),+m[1]);

 else unsupported.push(name(i)+'：'+line);

function formationEnemyDebuffs(){
 const result=[];
 formationState.slots.forEach((x,index)=>{
  if(!x||x.id.startsWith('summon-'))return;
  const c=formationUnit(x.id),form=c.cardForms[x.form],effect=formationStats(x).effect;
  const add=(text,trigger,target)=>{
   const tags=[];if(/攻击力/.test(text))tags.push('降攻击');if(/星级/.test(text))tags.push('降星');if(/攻速-/.test(text))tags.push('降攻速');if(/减速/.test(text))tags.push('减速');if(/眩晕/.test(text))tags.push('眩晕');
   result.push({source:c.name,form:form.label,position:index+1,star:x.star,level:x.level,text,trigger,target,tags});
  };
  // Keep the actual selected skill wording, including its conditions and caps.
  if(c.id==='103300'){
   effect.split('\n').forEach(line=>{if(line.startsWith('就绪：')&&/对手.*星级/.test(line))add(line,'ready','对方随从');if(line.startsWith('光环：')&&/对手.*攻速-/.test(line))add(line,'aura','对方符合条件的随从');});
  }else if(/就绪：.*(?:吸取对手|夺取对手|对手所有随从攻击力.*-)/.test(effect))add(effect,'ready','对方随从');
  else if(/法术.*对手.*星级.*-/.test(effect))add(effect,'spell','对方符合条件的随从');
  else if(/减速|眩晕/.test(effect)&&/敌人/.test(effect)){

 });

  renderDeck();
 });
 app.querySelectorAll('[data-deck-form]').forEach(b=>b.onclick=()=>{
   const c=companions.find(c=>c.id===deckState.pending),form=Number(b.dataset.deckForm);
   if(!c||c.cost!==deckCost(deckState.active)||!c.cardForms[form]||c.cardForms[form].mode!=='基础卡牌'||deckState.slots.some((x,i)=>i!==deckState.active&&x?.id===c.id))return;
   deckState.slots[deckState.active]={id:c.id,form};deckState.pending=null;
   const next=deckState.slots.findIndex(x=>!x);if(next>=0)deckState.active=next;else deckState.pickerOpen=false;deckState.query='';renderDeck();
 });
 document.getElementById("deckDownload").onclick=e=>downloadLineupImage("deck",e.currentTarget);
 document.getElementById('deckClear').onclick=()=>{deckState.slots=Array(9).fill(null);deckState.active=0;deckState.pickerOpen=false;deckState.query='';deckState.pending=null;renderDeck();};
 document.getElementById('deckSearch').oninput=e=>{const pos=e.target.selectionStart;deckState.query=e.target.value;renderDeck();const input=document.getElementById('deckSearch');input.focus();input.setSelectionRange(pos,pos);};
}

function closeDeckPicker(){
 if(state.tab!=='deck'||!deckState.pickerOpen)return;
 deckState.pickerOpen=false;deckState.pending=null;renderDeck();
}
document.addEventListener('pointerdown',e=>{
 if(state.tab!=='deck'||!deckState.pickerOpen)return;
 if(e.target.closest('.final-formation')){deckState.pickerOpen=false;const panel=app.querySelector('.deck-picker');if(panel)panel.hidden=true;return;}
 if(e.target.closest('.deck-picker,[data-deck-slot],[data-deck-remove],#deckClear'))return;
 closeDeckPicker();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.tab==='deck'&&deckState.pickerOpen){e.preventDefault();closeDeckPicker();app.querySelector('[data-deck-slot="'+deckState.active+'"]').focus();}});
function render(){
  if(state.tab==='home') renderHome();
  else if(state.tab==='wiki') renderWiki();
  else if(state.tab==='deck') renderDeck();
  else if(state.tab==='news') renderNews();
  else if(state.tab==='community') renderCommunity();
  else renderSocial();
}
if(location.hash==='#news'){state.tab='news';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='news'));}
render();

let lastSeasonIsRebel=isRebelSeason();
function refreshSeasonBoundary(){const next=isRebelSeason();if(next!==lastSeasonIsRebel){lastSeasonIsRebel=next;if(state.tab==='home')renderHome();}}
setInterval(refreshSeasonBoundary,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSeasonBoundary();});
</script>
</body>
</html>
